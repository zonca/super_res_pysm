apiVersion: v1
kind: Pod
metadata:
  name: sr3-8cards-pod
  namespace: javierhn-sds275
spec:
  restartPolicy: Never
  volumes:
    - name: scratch
      emptyDir: {}
    - name: mydir
      hostPath:
        path: /home/javierhn/models/sr3_pysm
        type: Directory
    - name: ceph
      hostPath:
        path: /voyager/ceph/users/javierhn
        type: Directory
  hostIPC: true
  containers:
    - name: gaudi-container
      image: vault.habana.ai/gaudi-docker/1.15.1/ubuntu22.04/habanalabs/pytorch-installer-2.2.0:latest
      #image: vault.habana.ai/gaudi-docker/1.18.0/ubuntu22.04/habanalabs/pytorch-installer-2.4.0:latest
      volumeMounts:
        - mountPath: /scratch
          name: scratch
        - mountPath: /mydir
          name: mydir 
        - mountPath: /ceph
          name: ceph 
      resources:
        limits:
          memory: 409G
          cpu: 95
          habana.ai/gaudi: 8
          hugepages-2Mi: 95000Mi
        requests:
          memory: 409G
          cpu: 95
          habana.ai/gaudi: 8
          hugepages-2Mi: 95000Mi
      command: ["/bin/sh","-c"]
      args:
        - >-
           hl-smi;
           export N_CARDS=8;
           export HOME=/scratch/tmp;
           export PATH=/scratch/tmp/.local/bin:$PATH;
           export MODEL_PATH=/mydir/Super-Resolution-SR3;
           export PT_HPU_MAX_COMPOUND_OP_SIZE=40;
           cd /mydir;
           pip install -r $MODEL_PATH/requirements.txt;

           export CMD="python $MODEL_PATH/sr.py \
                       -p train \
                       --distributed \
                       -c /mydir/sr_sr3_64_256_set3_b.json";
           mpirun -n $N_CARDS --bind-to core --map-by socket:PE=6 --rank-by core --report-bindings --allow-run-as-root -x PT_HPU_MAX_COMPOUND_OP_SIZE  $CMD;
         

